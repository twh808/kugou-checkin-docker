<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>酷狗账户信息工具</title>
<style>
  :root{
    --bg:#f2f4f8; --card:#ffffff; --primary:#1e80ff; --primary-dark:#1668d8;
    --text:#1f2329; --muted:#8a919f; --border:#e5e8ef; --success:#00b578;
    --danger:#f53f3f; --radius:12px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:24px 16px 60px;}
  .container{max-width:560px; margin:0 auto;}
  header{text-align:center; margin-bottom:20px;}
  header h1{font-size:22px; font-weight:700;}
  header p{color:var(--muted); font-size:13px; margin-top:4px;}
  .tabs{display:flex; background:#e7ebf2; border-radius:10px; padding:4px; margin-bottom:16px;}
  .tabs button{flex:1; border:none; background:transparent; padding:9px 0; border-radius:8px; font-size:14px; cursor:pointer; color:var(--muted); transition:all .2s;}
  .tabs button.active{background:#fff; color:var(--primary); font-weight:600; box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .card{background:var(--card); border-radius:var(--radius); padding:18px; box-shadow:0 2px 12px rgba(31,35,41,.06); margin-bottom:16px;}
  .field{display:flex; gap:8px; margin-bottom:12px;}
  .field input{flex:1; border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:15px; outline:none; min-width:0;}
  .field input:focus{border-color:var(--primary);}
  .btn{border:none; border-radius:8px; padding:10px 14px; font-size:14px; cursor:pointer; background:var(--primary); color:#fff; white-space:nowrap;}
  .btn:disabled{background:#a9c6f5; cursor:not-allowed;}
  .btn.ghost{background:#f0f2f6; color:var(--text);}
  .btn.ghost:hover{background:#e5e8ef;}
  .status{font-size:13px; margin-top:4px; min-height:18px; line-height:1.5;}
  .status.err{color:var(--danger);}
  .status.ok{color:var(--success);}
  .status.info{color:var(--muted);}
  .card-title{font-size:15px; font-weight:600; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;}
  .card-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .row{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 0; border-bottom:1px dashed var(--border); font-size:14px;}
  .row:last-child{border-bottom:none;}
  .row .label{color:var(--muted); flex-shrink:0;}
  .row .value{word-break:break-all; text-align:right; color:var(--text); min-width:0;}
  .copy-btn{flex-shrink:0; border:1px solid var(--border); background:#fff; border-radius:6px; padding:3px 8px; font-size:12px; color:var(--primary); cursor:pointer;}
  .copy-btn:hover{background:#f0f6ff;}
  details{margin-top:12px; font-size:13px;}
  summary{cursor:pointer; color:var(--muted);}
  pre{background:#f6f8fb; border-radius:8px; padding:12px; overflow:auto; max-height:320px; font-size:12px; margin-top:8px; white-space:pre-wrap; word-break:break-all;}
  .section-tag{display:inline-block; background:#e8f1ff; color:var(--primary); font-size:12px; border-radius:4px; padding:2px 8px; margin-bottom:8px;}
  .toast{position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:rgba(31,35,41,.9); color:#fff; font-size:13px; padding:8px 16px; border-radius:8px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:99;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>酷狗账户信息工具</h1>
    <p>登录后可查看并复制账户信息</p>
  </header>

  <div class="tabs">
    <button id="tabNormal" class="active" data-platform="normal">普通版</button>
    <button id="tabLite" data-platform="lite">概念版</button>
  </div>

  <!-- 登录面板 -->
  <div class="card" id="loginPanel">
    <div class="field">
      <input type="tel" id="phone" placeholder="请输入手机号" maxlength="11" autocomplete="tel">
      <button class="btn" id="sendCodeBtn">发送验证码</button>
    </div>
    <div class="field">
      <input type="text" id="code" placeholder="请输入验证码" maxlength="8" autocomplete="one-time-code">
      <button class="btn" id="loginBtn">登录</button>
    </div>
    <div class="status info" id="loginStatus"></div>
  </div>

  <!-- 信息面板 -->
  <div class="card" id="infoPanel" style="display:none;">
    <div class="card-title">
      <span id="platformLabel">账户信息</span>
      <div class="card-actions">
        <button class="btn ghost" id="copyTextBtn">复制全部（文本）</button>
        <button class="btn ghost" id="copyJsonBtn">复制全部（JSON）</button>
        <button class="btn ghost" id="copyCredBtn">复制拼接串</button>
        <button class="btn ghost" id="reloginBtn">重新登录</button>
      </div>
    </div>
    <div id="infoCard"></div>
    <details>
      <summary>查看原始 JSON</summary>
      <pre id="rawJson"></pre>
    </details>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  var API_BASE = window.location.origin;
  var currentPlatform = 'normal';
  var collected = {};

  var phoneEl = document.getElementById('phone');
  var codeEl = document.getElementById('code');
  var sendBtn = document.getElementById('sendCodeBtn');
  var loginBtn = document.getElementById('loginBtn');
  var loginStatus = document.getElementById('loginStatus');
  var loginPanel = document.getElementById('loginPanel');
  var infoPanel = document.getElementById('infoPanel');
  var platformLabel = document.getElementById('platformLabel');
  var infoCard = document.getElementById('infoCard');
  var rawJsonEl = document.getElementById('rawJson');

  function apiBase(){
    return API_BASE + (currentPlatform === 'lite' ? '/api/lite' : '/api/normal');
  }
  function platformName(){ return currentPlatform === 'lite' ? '概念版' : '普通版'; }

  function setStatus(msg, type){
    loginStatus.className = 'status ' + (type || 'info');
    loginStatus.textContent = msg || '';
  }

  var toastTimer = null;
  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1600);
  }

  function copyText(text){
    if(!text){ toast('没有可复制的内容'); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('已复制'); }, function(){ fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('已复制'); } catch(e){ toast('复制失败，请手动复制'); }
    document.body.removeChild(ta);
  }

  // ---- mid#dfid#uid#token 拼接串 ----
  function getCookie(name){
    var m = document.cookie.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[1].trim()) : '';
  }
  function randomHex(len){
    var chars = '0123456789abcdef', s = '';
    for(var i = 0; i < len; i++) s += chars[Math.floor(Math.random() * 16)];
    return s;
  }
  function randomAlnum(len){
    var chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789', s = '';
    for(var i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }
  function randomDigits(len){
    var s = '';
    for(var i = 0; i < len; i++) s += Math.floor(Math.random() * 10);
    return s;
  }
  function buildCredential(){
    // mid：优先取服务器下发的 KUGOU_API_MID，不存在则随机 40 位十六进制
    var mid = getCookie('KUGOU_API_MID') || randomHex(40);
    // dfid：登录流程不会下发 dfid，缺失时按模板随机 20 位字母数字
    var dfid = getCookie('dfid') || randomAlnum(20);
    // uid：优先取登录下发的 userid / 用户信息中的 id，缺失则随机 10 位数字
    var d = collected.detail || {};
    var uid = getCookie('userid') || d.userid || d.id || randomDigits(10);
    // token：登录下发的 token
    var token = getCookie('token') || d.token || '';
    return mid + '#' + dfid + '#' + uid + '#' + token;
  }

  // ---- 平台切换 ----
  function setPlatform(p){
    currentPlatform = p;
    document.getElementById('tabNormal').classList.toggle('active', p === 'normal');
    document.getElementById('tabLite').classList.toggle('active', p === 'lite');
    infoPanel.style.display = 'none';
    loginPanel.style.display = 'block';
    setStatus('已切换到' + platformName() + '（' + apiBase() + '），请登录后查看账户信息。', 'info');
  }
  document.getElementById('tabNormal').addEventListener('click', function(){ setPlatform('normal'); });
  document.getElementById('tabLite').addEventListener('click', function(){ setPlatform('lite'); });

  // ---- 发送验证码 ----
  var countdown = 0;
  sendBtn.addEventListener('click', function(){
    var phone = phoneEl.value.trim();
    if(!/^\d{6,11}$/.test(phone)){ setStatus('请输入正确的手机号', 'err'); return; }
    setStatus('正在发送验证码…', 'info');
    sendBtn.disabled = true;
    fetch(apiBase() + '/captcha/sent', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'mobile=' + encodeURIComponent(phone)
    }).then(function(res){ return res.json(); }).then(function(json){
      if(json && (json.status === 1 || json.status === '1')){
        setStatus('验证码已发送，请查收短信', 'ok');
        startCountdown(60);
      } else {
        sendBtn.disabled = false;
        setStatus(errorText(json), 'err');
      }
    }).catch(function(err){
      sendBtn.disabled = false;
      setStatus('发送失败：' + err.message, 'err');
    });
  });

  function startCountdown(sec){
    countdown = sec;
    sendBtn.textContent = '重新发送(' + countdown + 's)';
    var t = setInterval(function(){
      countdown--;
      if(countdown <= 0){
        clearInterval(t);
        sendBtn.textContent = '发送验证码';
        sendBtn.disabled = false;
      } else {
        sendBtn.textContent = '重新发送(' + countdown + 's)';
      }
    }, 1000);
  }

  function errorText(json){
    if(!json) return '无响应';
    var parts = [];
    if(json.errmsg) parts.push(json.errmsg);
    if(json.error_code !== undefined && json.error_code !== null && json.error_code !== 0) parts.push('错误码:' + json.error_code);
    if(json.status !== undefined && json.status !== 1 && json.status !== '1') parts.push('status:' + json.status);
    if(parts.length) return parts.join(' ');
    return '操作失败（' + JSON.stringify(json).slice(0, 200) + '）';
  }

  // ---- 登录 ----
  loginBtn.addEventListener('click', function(){
    var phone = phoneEl.value.trim();
    var code = codeEl.value.trim();
    if(!/^\d{6,11}$/.test(phone)){ setStatus('请输入正确的手机号', 'err'); return; }
    if(!code){ setStatus('请输入验证码', 'err'); return; }
    loginBtn.disabled = true;
    setStatus('正在登录…', 'info');
    fetch(apiBase() + '/login/cellphone', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'mobile=' + encodeURIComponent(phone) + '&code=' + encodeURIComponent(code)
    }).then(function(res){ return res.json(); }).then(function(json){
      loginBtn.disabled = false;
      if(json && (json.status === 1 || json.status === '1')){
        setStatus('登录成功，正在获取账户信息…', 'ok');
        loadInfo();
      } else {
        setStatus(errorText(json), 'err');
      }
    }).catch(function(err){
      loginBtn.disabled = false;
      setStatus('登录失败：' + err.message, 'err');
    });
  });

  // ---- 获取账户信息 ----
  function loadInfo(){
    collected = { platform: platformName(), api: apiBase() };
    var p1 = fetch(apiBase() + '/user/detail').then(parseJson);
    var p2 = fetch(apiBase() + '/user/vip/detail').then(parseJson);
    var p3 = fetch(apiBase() + '/user/playlist?page=1&pagesize=30').then(parseJson);
    Promise.all([p1, p2, p3]).then(function(results){
      collected.detail = unwrap(results[0]);
      collected.vip = unwrap(results[1]);
      collected.playlist = unwrap(results[2]);
      render();
    }).catch(function(err){
      setStatus('获取账户信息失败：' + err.message, 'err');
    });
  }

  function parseJson(res){ return res.json(); }
  function unwrap(json){
    if(json && typeof json === 'object' && json.status === 1 && json.data !== undefined) return json.data;
    return json;
  }

  var LABELS = {
    userid:'用户ID', nickname:'昵称', nick:'昵称', gender:'性别', img:'头像', avatar:'头像',
    vip_type:'VIP类型', user_name:'用户名', email:'邮箱', phonenumber:'手机号',
    regtime:'注册时间', age:'年龄', level:'等级', signature:'签名', introduce:'简介'
  };

  function genderText(v){
    if(v === 1 || v === '1') return '男';
    if(v === 2 || v === '2') return '女';
    return String(v);
  }

  function render(){
    var rows = [];
    function addRows(obj, prefix){
      if(!obj || typeof obj !== 'object') return;
      Object.keys(obj).forEach(function(k){
        var v = obj[k];
        if(v === null || v === undefined || v === '') return;
        if(typeof v === 'object') return;
        var label = LABELS[k] || k;
        if(prefix) label = prefix + '·' + label;
        if(k === 'gender' && !prefix) v = genderText(v);
        rows.push({label: label, value: String(v)});
      });
    }

    rows.push({label:'平台', value: platformName()});
    addRows(collected.detail);
    var hasUid = rows.some(function(r){ return r.label === '用户ID' && r.value !== '—'; });
    if(!hasUid) rows.push({label:'用户ID', value: '—'});

    // VIP 信息
    var vip = collected.vip;
    if(vip && typeof vip === 'object' && Object.keys(vip).length){
      Object.keys(vip).forEach(function(k){
        var v = vip[k];
        if(v === null || v === undefined || v === '') return;
        if(typeof v === 'object') return;
        rows.push({label: 'VIP·' + k, value: String(v)});
      });
    }

    // 歌单
    var pl = collected.playlist;
    var list = (pl && Array.isArray(pl.list)) ? pl.list : [];
    rows.push({label:'歌单数量', value: String(pl && pl.total ? pl.total : list.length)});

    // 拼接串置顶展示
    collected.credential = buildCredential();
    rows.unshift({label: '拼接串(mid#dfid#uid#token)', value: collected.credential});

    var html = '';
    rows.forEach(function(r){
      html += '<div class="row"><span class="label">' + esc(r.label) + '</span><span class="value">' + esc(r.value) + '</span><button class="copy-btn" data-value="' + esc(r.value) + '">复制</button></div>';
    });
    infoCard.innerHTML = html;

    // 歌单名称列表（前 20 个）
    var playlistNames = [];
    if(Array.isArray(list)){
      list.slice(0, 20).forEach(function(item){
        var name = item && (item.specialname || item.name || item.title);
        if(name) playlistNames.push(String(name));
      });
    }
    if(playlistNames.length){
      var extra = '<div style="margin-top:10px;"><div class="section-tag">歌单（前' + playlistNames.length + '个）</div></div>';
      playlistNames.forEach(function(n){
        extra += '<div class="row"><span class="label">歌单</span><span class="value">' + esc(n) + '</span><button class="copy-btn" data-value="' + esc(n) + '">复制</button></div>';
      });
      infoCard.insertAdjacentHTML('beforeend', extra);
    }

    collected.rows = rows;
    rawJsonEl.textContent = JSON.stringify(collected, null, 2);

    loginPanel.style.display = 'none';
    infoPanel.style.display = 'block';
    platformLabel.textContent = '账户信息 · ' + platformName();
  }

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // 复制按钮统一事件委托
  infoCard.addEventListener('click', function(ev){
    var btn = ev.target && ev.target.closest ? ev.target.closest('.copy-btn') : null;
    if(btn) copyText(btn.getAttribute('data-value'));
  });

  // 复制全部（文本）
  document.getElementById('copyTextBtn').addEventListener('click', function(){
    if(!collected.rows){ toast('暂无数据'); return; }
    var lines = ['【酷狗账户信息 · ' + platformName() + '】'];
    if(collected.credential) lines.push('拼接串: ' + collected.credential);
    collected.rows.forEach(function(r){ lines.push(r.label + ': ' + r.value); });
    var pl = collected.playlist;
    var list = (pl && Array.isArray(pl.list)) ? pl.list : [];
    var names = [];
    list.forEach(function(item){
      var n = item && (item.specialname || item.name || item.title);
      if(n) names.push(String(n));
    });
    if(names.length) lines.push('歌单(' + names.length + '个): ' + names.join('、'));
    copyText(lines.join('\n'));
  });

  // 复制全部（JSON）
  document.getElementById('copyJsonBtn').addEventListener('click', function(){
    if(!collected.detail){ toast('暂无数据'); return; }
    copyText(JSON.stringify(collected, null, 2));
  });

  // 复制拼接串 mid#dfid#uid#token
  document.getElementById('copyCredBtn').addEventListener('click', function(){
    if(!collected.credential){ toast('暂无数据'); return; }
    copyText(collected.credential);
  });

  // 重新登录
  document.getElementById('reloginBtn').addEventListener('click', function(){
    infoPanel.style.display = 'none';
    loginPanel.style.display = 'block';
    codeEl.value = '';
    setStatus('请重新登录', 'info');
  });
})();
</script>
</body>
</html>
